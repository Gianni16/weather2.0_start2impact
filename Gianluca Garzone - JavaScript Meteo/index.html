<!DOCTYPE html>
<html lang='en'>
<head>

  <title>Weather</title>
  <meta charset='UTF-8'/>
  <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0'/>
  <meta name='description' content='Front-end developer'>

  <link href='style.css' rel='stylesheet' type='text/css'>
  <link href="https://fonts.googleapis.com/css?family=Oswald&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Oswald', sans-serif;
    }
    </style>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src='script.js'></script>

  <body>

    <div class='page'>

      <header>

        <div class='header'>

          <h1>WEATHER</h1>

          </div>

          </header>

          <div class='form-row' align='center'>

            <div class='form-row-2' id='display'>

            <input type='text' id='cityName' name='cityName' placeholder='City name'/>

            <img class='location' id='pinIcon' onclick='getLocation()' src='footer-icon/pin.png' width='18' height='18'/>

            <button onclick='getWeather ()'>Search</button>

          </div>

            </div>

            <section>

              <div class='content'>

                <table id='#t01'>

                <div class='city-name'>

                <a class='weatherResponse' id='weatherResponse'></a>

                <img id='weatherIcon' width='75' src=''/>

              </div>

                <tr>
                  <td>Temperature</td>
                  <td><a class='weatherTemperature' id='weatherTemperature'></a></td>
                </tr>

                <tr>
                  <td>Max</td>
                  <td><a class='weatherTemperatureMax' id='weatherTemperatureMax'></a></td>
                </tr>

                <tr>
                  <td>Min</td>
                  <td><a class='weatherTemperatureMin' id='weatherTemperatureMin'></a></td>
                </tr>

                <tr>
                  <td>Humidity</td>
                  <td><a class='weatherHumidity' id='weatherHumidity'></a></td>
                </tr>

                <tr>
                  <td>Wind</td>
                  <td><a class='weatherWindSpeed' id ='weatherWindSpeed'></a></td>
                </tr>

              </table>

              </div>

                </section>

                <footer>

                  <div class='footer'>

                      <img src='footer-icon/linkedin-icon.png' width='35'/></a>
